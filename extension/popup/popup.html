<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UAT Session Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand-lockup">
          <div class="tracker-logo" aria-hidden="true"></div>
          <div>
            <h1>UAT Session Tracker</h1>
            <div id="status" class="status">Checking...</div>
          </div>
        </div>
        <button id="minimizeTracker" class="icon-button" title="Minimize tracker">-</button>
      </header>

      <section id="trackerBody">
        <section class="stats">
          <div><span>Session</span><strong id="sessionId">-</strong></div>
          <div><span>Events</span><strong id="eventCount">0</strong></div>
          <div><span>API Calls</span><strong id="apiCount">0</strong></div>
          <div><span>Errors</span><strong id="errorCount">0</strong></div>
        </section>

        <section id="reportForm" class="report-form">
          <label>
            What went wrong?
            <textarea id="description" placeholder="Optional description"></textarea>
          </label>
          <button id="sendReport">Report Issue</button>
          <button id="retryReports" class="secondary">Retry Pending</button>
          <button id="clearRecording" class="danger">Clear Recorded Activity</button>
          <p class="warning-text">Clearing removes the current unsent session, API calls, UI events, and errors from this browser.</p>
          <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="settings">
          <label>
            Backend URL
            <input id="apiBaseUrl" />
          </label>
          <label>
            Allowed UAT origins
            <textarea id="allowedOrigins" placeholder="https://uat.example.com"></textarea>
          </label>
          <label>
            Tester/User name
            <input id="userIdentifier" placeholder="e.g. piyush.soni@47billion.com" />
          </label>
          <label class="check-row">
            <input id="captureSensitive" type="checkbox" />
            <span>Capture tokens and cookies</span>
          </label>
          <label class="check-row">
            <input id="showFloatingWidget" type="checkbox" />
            <span>Show floating tracker on page</span>
          </label>
          <label>
            Keep last activity for
            <input id="retentionMinutes" type="number" min="1" max="60" />
            <span class="hint">Minutes of recent clicks, errors, and API calls kept before reporting.</span>
          </label>
          <button id="saveSettings" class="secondary">Save Settings</button>
        </section>
      </section>

      <footer>UAT Tracker by 47Billion. Copyright (c) 2026 47Billion. All rights reserved.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
